app-id: io.github.mahdi-arts.clipboard-history
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: win11-clipboard-history

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.Settings
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-data/win11-clipboard-history:create
  - --filesystem=xdg-config/win11-clipboard-history:create
  - --env=NO_AT_BRIDGE=1
  # Paste via /dev/uinput is not possible under Flathub's device policy.
  # Install the .deb/.rpm for full paste, or:
  #   flatpak override --user --device=all io.github.mahdi-arts.clipboard-history
  # Optional GIF search:
  #   flatpak override --user --share=network io.github.mahdi-arts.clipboard-history

modules:
  - name: xclip
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/astrand/xclip.git
        tag: 0.13

  - name: wl-clipboard
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/bugaevc/wl-clipboard.git
        tag: v2.2.1

  - name: win11-clipboard-history
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
      env:
        CARGO_HOME: /run/build/win11-clipboard-history/cargo
        npm_config_cache: /run/build/win11-clipboard-history/npm-cache
    build-commands:
      - npm ci --no-audit --no-fund
      - npm run build
      - cd src-tauri && cargo build --release --features custom-protocol
      - install -Dm755 src-tauri/target/release/win11-clipboard-history-bin
        ${FLATPAK_DEST}/lib/win11-clipboard-history/win11-clipboard-history-bin
      - install -Dm755 src-tauri/bundle/linux/wrapper.sh
        ${FLATPAK_DEST}/bin/win11-clipboard-history
      - install -Dm644 src-tauri/bundle/linux/win11-clipboard-history.desktop
        ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - sed -i "s/^Exec=.*/Exec=${FLATPAK_ID}/" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 src-tauri/icons/128x128.png
        ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/icon.png
        ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 src-tauri/icons/icon.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: dir
        path: ../..
