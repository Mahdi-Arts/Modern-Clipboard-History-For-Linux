name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Frontend + Rust quality gates (lint, format, unit tests, coverage)
  quality:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libglib2.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint + TypeScript
        run: npm run lint

      - name: Frontend tests with coverage gate
        run: npm run test:coverage

      - name: Rust format
        run: cd src-tauri && cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        run: cd src-tauri && cargo test --all-features

  # Blocking supply-chain audits
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (blocking)
        run: cd src-tauri && cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: npm audit (blocking, high+)
        run: npm audit --audit-level=high

  # Production Linux build + CLI smoke
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libglib2.0-dev xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: CLI smoke (--version / --help)
        run: |
          BIN=src-tauri/target/release/win11-clipboard-history-bin
          test -x "$BIN"
          "$BIN" --version
          "$BIN" --help
          xvfb-run --auto-servernum "$BIN" --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
