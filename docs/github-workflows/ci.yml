name: CI

# Hardened quality gate — every check in this file is BLOCKING.
# گیت کیفیت سخت‌گیرانه — تمام بررسی‌های این فایل «مسدودکننده» هستند.
#
# Contract (mirrored in README.md — keep both in sync):
#   - ESLint + tsc, zero warnings
#   - Frontend unit tests WITH coverage thresholds
#   - cargo fmt + clippy -D warnings + cargo test
#   - cargo audit / npm audit --audit-level=high / cargo-deny (no continue-on-error)
#   - Release build + CLI smoke (--version / --help) under Xvfb

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------
  # Frontend + Rust quality gates (lint, format, unit tests, coverage)
  # گیت‌های کیفیت فرانت‌اند و Rust (لینت، فرمت، تست واحد، پوشش)
  # ---------------------------------------------------------------------
  quality:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libglib2.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint + TypeScript
        run: npm run lint

      - name: Frontend tests with coverage gate
        run: npm run test:coverage

      - name: Rust format
        run: cd src-tauri && cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

      - name: Rust unit tests
        run: cd src-tauri && cargo test --all-features

  # ---------------------------------------------------------------------
  # Blocking supply-chain audits (no continue-on-error)
  # ممیزی‌های مسدودکنندهٔ زنجیرهٔ تأمین (بدون continue-on-error)
  # ---------------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master

      - name: Install cargo-audit + cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: cargo audit (RustSec advisories — blocking)
        run: cd src-tauri && cargo audit

      - name: cargo deny (licenses, bans, sources — blocking)
        run: cd src-tauri && cargo deny check advisories bans licenses sources

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: npm audit (blocking, high+)
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------
  # Production Linux build + CLI smoke test
  # بیلد لینوکس + تست دودی CLI
  # ---------------------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [quality, security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libglib2.0-dev xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: CLI smoke (--version / --help)
        run: |
          BIN=src-tauri/target/release/win11-clipboard-history-bin
          test -x "$BIN"
          "$BIN" --version
          "$BIN" --help
          xvfb-run --auto-servernum "$BIN" --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
