name: Release

# Trusted release pipeline.
# خط لولهٔ انتشار مورد اعتماد.
#
# Contract (mirrored in README.md — keep both in sync):
#   - Multi-arch builds (x86_64 + aarch64)
#   - Publishes .deb / .rpm / AppImage + SHA256SUMS + per-artifact SPDX SBOM
#   - SLSA build-provenance attestations via GitHub artifact attestations
#   - Every URL points at this repository (Mahdi-Arts/Windows-11-Style-Clipboard-History-Manager)
#   - Optional channels (Cloudsmith / AUR / GPG signing) are opt-in via
#     repository secrets and fail closed when unconfigured
#
# Supply chain: every action is pinned to a full commit SHA (OpenSSF
# recommendation) — tags are listed in comments for review, not used.
# زنجیرهٔ تأمین: هر action به SHA کامل کامیت پین شده است — تگ‌ها فقط در
# کامنت برای بازبینی آمده‌اند، نه برای اجرا.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REPO: Mahdi-Arts/Windows-11-Style-Clipboard-History-Manager

jobs:
  # ---------------------------------------------------------------------
  # Build both architectures from the tagged commit
  # ساخت هر دو معماری از کامیت تگ‌شده
  # ---------------------------------------------------------------------
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust (rustup, from rust-toolchain.toml)
        # rustup ships on GitHub runners; the toolchain is pinned by the
        # repository's rust-toolchain.toml. No third-party action, retries
        # on transient network failures.
        # / toolchain از فایل مخزن پین می‌شود؛ بدون اکشن شخص ثالث، با
        # تلاش مجدد روی خطاهای گذرای شبکه.
        run: |
          set -euo pipefail
          rustup set profile minimal
          for attempt in 1 2 3; do
            if rustup toolchain install; then
              rustc --version && cargo --version
              exit 0
            fi
            echo "::warning::rustup install failed (attempt ${attempt}/3), retrying in 15s"
            sleep 15
          done
          echo "::error::rustup toolchain install failed after 3 attempts"
          exit 1

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libglib2.0-dev

      - name: Update version files
        env:
          SYNC_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          echo "Syncing version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' src-tauri/tauri.conf.json
          sed -i '0,/^version = "[^"]*"/s//version = "'"$VERSION"'"/' src-tauri/Cargo.toml
          # Keep the lockfile, Debian changelog and AppStream metainfo in
          # sync too — scripts/check-packaging.sh fails on any drift.
          # / lockfile، changelog دبیان و متاینفو AppStream نیز همگام
          # می‌شوند — check-packaging.sh روی هر رانش خطا می‌دهد.
          python3 - <<'VERSYNC'
          import re, pathlib
          lock = pathlib.Path("src-tauri/Cargo.lock")
          text, n = re.subn(
              r'(name = "windows-11-style-clipboard-history-manager"\nversion = ")[^"]+(")',
              r"\g<1>" + __import__("os").environ["SYNC_VERSION"] + r"\g<2>",
              lock.read_text(),
          )
          assert n == 1, f"Cargo.lock: expected 1 package block, found {n}"
          lock.write_text(text)
          VERSYNC
          sed -i '1s/([^)]*)/('"$VERSION"'-1)/' packaging/debian/changelog
          sed -i '0,/<release version="[^"]*"/s//<release version="'"$VERSION"'"/' packaging/flatpak/io.github.mahdi-arts.clipboard-history.metainfo.xml
          echo "=== Versions after sync ==="
          echo "package.json: $(grep '"version"' package.json | head -1)"
          echo "tauri.conf.json: $(grep '"version"' src-tauri/tauri.conf.json | head -1)"
          echo "Cargo.toml: $(grep '^version' src-tauri/Cargo.toml | head -1)"
          echo "Cargo.lock: $(grep -A1 'name = \"windows-11-style-clipboard-history-manager\"' src-tauri/Cargo.lock | grep version | head -1)"
          echo "debian/changelog: $(head -1 packaging/debian/changelog)"
          echo "metainfo: $(grep -o 'release version=\"[^"]*' packaging/flatpak/io.github.mahdi-arts.clipboard-history.metainfo.xml | head -1)"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Normalize artifact filenames (canonical package name)
        # Whatever casing the bundler used, published files must match the
        # names referenced by README, PKGBUILD, installer and SHA256SUMS.
        # / نام فایل‌های منتشرشده باید با نام‌های README، PKGBUILD، نصاب و
        # SHA256SUMS یکی باشد؛ این گام تضمین می‌کند.
        run: bash scripts/normalize-artifacts.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          retention-days: 1

  # ---------------------------------------------------------------------
  # Publish the GitHub Release with checksums, SBOM and provenance
  # انتشار GitHub Release همراه checksumها، SBOM و provenance
  # ---------------------------------------------------------------------
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten artifacts and generate SHA256SUMS
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp -v {} dist/ \;
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # -----------------------------------------------------------------
      # Optional GPG signature over SHA256SUMS (opt-in via secrets).
      # When RELEASE_GPG_PRIVATE_KEY is set, SHA256SUMS.sig is published and
      # the installer can enforce it with WIN11_CLIPBOARD_TRUST_KEY.
      # امضای اختیاری GPG روی SHA256SUMS (با secret فعال می‌شود). وقتی
      # RELEASE_GPG_PRIVATE_KEY تنظیم باشد، SHA256SUMS.sig منتشر می‌شود و
      # نصاب می‌تواند آن را با WIN11_CLIPBOARD_TRUST_KEY الزام کند.
      # -----------------------------------------------------------------
      - name: Sign SHA256SUMS (optional GPG)
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$RELEASE_GPG_PRIVATE_KEY" ]; then
            echo "::notice::RELEASE_GPG_PRIVATE_KEY not set; publishing unsigned SHA256SUMS"
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          passphrase_args=()
          if [ -n "$RELEASE_GPG_PASSPHRASE" ]; then
            passphrase_args=(--pinentry-mode loopback --passphrase "$RELEASE_GPG_PASSPHRASE")
          fi
          gpg --batch --yes "${passphrase_args[@]}" \
            --armor --detach-sign --output dist/SHA256SUMS.sig dist/SHA256SUMS
          echo "::notice::SHA256SUMS.sig published; verify with WIN11_CLIPBOARD_TRUST_KEY"

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Generate per-artifact SPDX SBOM
        run: |
          # One SPDX JSON per distributable artifact, named after the file.
          # یک SBOM جدا برای هر آرتیفکت توزیع‌شدنی.
          set -euo pipefail
          shopt -s nullglob
          for f in dist/*.deb dist/*.rpm dist/*.AppImage; do
            base="$(basename "$f")"
            echo "Scanning $base ..."
            syft scan "file:$f" -o spdx-json > "dist/${base}.spdx.json"
          done
          ls -la dist/

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/*.spdx.json

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'dev') }}
          files: |
            dist/**
          body: |
            # 📋 Clipboard History for Linux ${{ github.ref_name }}

            A fast, bilingual clipboard manager for Linux (Wayland & X11).
            مدیر کلیپ‌بورد سریع و دوزبانه برای لینوکس (Wayland و X11).

            ## 🔐 Verify downloads / تأیید دانلود

            Every artifact is listed in `SHA256SUMS`. An SPDX SBOM and a SLSA
            build-provenance attestation are attached to this release.
            هر آرتیفکت در `SHA256SUMS` فهرست شده؛ SBOM و گواهی provenance نیز پیوست است.

            ```bash
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            Prefer your package manager over piping scripts to bash. Review
            `scripts/install.sh` before running it.
            ترجیحاً از مدیر بستهٔ خود استفاده کنید؛ پیش از اجرای اسکریپت، آن را بازبینی کنید.

            ## 📦 Install / نصب

            ### Debian / Ubuntu

            ```bash
            sudo apt install ./windows-11-style-clipboard-history-manager_${{ steps.get_version.outputs.VERSION }}_amd64.deb
            sudo setfacl -m u:$USER:rw /dev/uinput
            ```

            ### Fedora

            ```bash
            sudo dnf install ./windows-11-style-clipboard-history-manager-${{ steps.get_version.outputs.VERSION }}-1.x86_64.rpm
            sudo setfacl -m u:$USER:rw /dev/uinput
            ```

            ### Arch Linux (AUR)

            ```bash
            yay -S windows-11-style-clipboard-history-manager-bin
            ```

            ### Convenience installer (review first / اول بازبینی کنید)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/Mahdi-Arts/Windows-11-Style-Clipboard-History-Manager/master/scripts/install.sh -o install-clipboard.sh
            less install-clipboard.sh
            bash install-clipboard.sh
            ```

            The installer **requires** a matching `SHA256SUMS` entry
            (`ALLOW_UNVERIFIED=1` to skip — not recommended).
            نصاب **الزاماً** checksum را با `SHA256SUMS` تطبیق می‌دهد.

            ### Flatpak

            See [`packaging/README.md`](https://github.com/Mahdi-Arts/Windows-11-Style-Clipboard-History-Manager/blob/master/packaging/README.md).
            The sandbox does not grant `/dev/uinput`; use `.deb`/`.rpm` for paste
            simulation, or `flatpak override --user --device=all io.github.mahdi-arts.clipboard-history`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------
      # Optional distribution channels — enabled only when secrets exist.
      # کانال‌های توزیع اختیاری — فقط وقتی secret تنظیم شده باشد.
      # -----------------------------------------------------------------
      - name: Upload to Cloudsmith (stable releases only)
        if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev') }}
        continue-on-error: true
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          if [ -z "$CLOUDSMITH_API_KEY" ]; then
            echo "::notice::CLOUDSMITH_API_KEY not set, skipping Cloudsmith upload"
            exit 0
          fi
          pip install cloudsmith-cli
          VERSION=${{ steps.get_version.outputs.VERSION }}
          echo "Uploading STABLE release v$VERSION to Cloudsmith..."
          for deb in dist/*.deb; do
            [ -f "$deb" ] || continue
            cloudsmith push deb mahdi-arts/clipboard-manager/any-distro/any-version \
              "$deb" --api-key "$CLOUDSMITH_API_KEY" || echo "::warning::Cloudsmith .deb upload failed for $deb"
          done
          for rpm in dist/*.rpm; do
            [ -f "$rpm" ] || continue
            cloudsmith push rpm mahdi-arts/clipboard-manager/any-distro/any-version \
              "$rpm" --api-key "$CLOUDSMITH_API_KEY" || echo "::warning::Cloudsmith .rpm upload failed for $rpm"
          done

      # -----------------------------------------------------------------
      # AUR update — fail closed.
      # The AUR SSH host key is NEVER trusted on first use. The maintainer
      # must store verified known_hosts lines for aur.archlinux.org in the
      # AUR_KNOWN_HOSTS secret:
      #   ssh-keyscan aur.archlinux.org >> known_hosts   (then verify the
      #   fingerprints against a trusted channel, e.g. the Arch infra docs)
      # Without that secret the update is skipped with a notice.
      # به‌روزرسانی AUR — fail closed. کلید میزبان AUR هرگز به‌صورت
      # trust-on-first-use پذیرفته نمی‌شود. نگهدارنده باید خطوط known_hosts
      # تأییدشدهٔ aur.archlinux.org را در secret ی AUR_KNOWN_HOSTS بگذارد:
      #   ssh-keyscan aur.archlinux.org >> known_hosts   (سپس اثر انگشت‌ها را
      #   با یک کانال معتبر، مانند مستندات زیرساخت Arch، مقایسه کنید)
      # بدون این secret، به‌روزرسانی با یک notice رد می‌شود.
      # -----------------------------------------------------------------
      - name: Update AUR Package
        if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev') }}
        continue-on-error: true
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::AUR_SSH_KEY not set, skipping AUR update"
            exit 0
          fi
          if [ -z "$AUR_KNOWN_HOSTS" ]; then
            echo "::warning::AUR_KNOWN_HOSTS not set; refusing trust-on-first-use SSH. Skipping AUR update."
            echo "::warning::Generate it with: ssh-keyscan aur.archlinux.org (verify fingerprints first)"
            exit 0
          fi

          VERSION=${{ steps.get_version.outputs.VERSION }}
          DEB_X86_64=$(find dist -name "*_amd64.deb" | head -1)
          DEB_ARM64=$(find dist -name "*_arm64.deb" | head -1)

          if [ -z "$DEB_X86_64" ]; then
            echo "::error::x86_64 .deb not found, skipping AUR update"
            exit 0
          fi

          SHA256_X86_64=$(sha256sum "$DEB_X86_64" | cut -d' ' -f1)
          SHA256_ARM64=""
          if [ -n "$DEB_ARM64" ]; then
            SHA256_ARM64=$(sha256sum "$DEB_ARM64" | cut -d' ' -f1)
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          echo "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts" > ~/.ssh/config
          chmod 600 ~/.ssh/config

          git clone ssh://aur@aur.archlinux.org/windows-11-style-clipboard-history-manager-bin.git /tmp/aur-pkg
          cd /tmp/aur-pkg

          cp "$GITHUB_WORKSPACE/aur/PKGBUILD" PKGBUILD
          cp "$GITHUB_WORKSPACE/aur/windows-11-style-clipboard-history-manager-bin.install" . 2>/dev/null || true

          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums_x86_64=.*/sha256sums_x86_64=('$SHA256_X86_64')/" PKGBUILD
          if [ -n "$SHA256_ARM64" ]; then
            sed -i "s/sha256sums_aarch64=.*/sha256sums_aarch64=('$SHA256_ARM64')/" PKGBUILD
          else
            sed -i "s/sha256sums_aarch64=.*/sha256sums_aarch64=('SKIP')/" PKGBUILD
          fi

          # Generate .SRCINFO inside a real Arch container when Docker exists,
          # otherwise fall back to a hand-written file (URLs: this repository).
          # .SRCINFO در کانتینر واقعی Arch تولید می‌شود؛ در نبود Docker، فایل
          # دست‌نویس با URLهای همین مخزن نوشته می‌شود.
          if command -v docker >/dev/null 2>&1; then
            docker run --rm -v "$PWD:/pkg" archlinux bash -c "
              pacman -Sy --noconfirm pacman-contrib
              cd /pkg
              makepkg --printsrcinfo > .SRCINFO
            "
          else
            echo "::warning::Docker unavailable; writing .SRCINFO manually"
            TAB=$'\t'
            cat > .SRCINFO << SRCINFO_EOF
          pkgbase = windows-11-style-clipboard-history-manager-bin
          ${TAB}pkgdesc = Windows 11-style Clipboard History Manager for Linux
          ${TAB}pkgver = $VERSION
          ${TAB}pkgrel = 1
          ${TAB}url = https://github.com/${REPO}
          ${TAB}install = windows-11-style-clipboard-history-manager-bin.install
          ${TAB}arch = x86_64
          ${TAB}arch = aarch64
          ${TAB}license = MIT
          ${TAB}depends = webkit2gtk-4.1
          ${TAB}depends = gtk3
          ${TAB}depends = libayatana-appindicator
          ${TAB}depends = xclip
          ${TAB}depends = xdotool
          ${TAB}depends = wl-clipboard
          ${TAB}depends = acl
          ${TAB}depends = polkit
          ${TAB}optdepends = libappindicator-gtk3: Legacy tray icon support
          ${TAB}provides = windows-11-style-clipboard-history-manager
          ${TAB}conflicts = windows-11-style-clipboard-history-manager
          ${TAB}options = !strip
          ${TAB}options = !debug
          ${TAB}source_x86_64 = https://github.com/${REPO}/releases/download/v$VERSION/windows-11-style-clipboard-history-manager_${VERSION}_amd64.deb
          ${TAB}sha256sums_x86_64 = $SHA256_X86_64
          ${TAB}source_aarch64 = https://github.com/${REPO}/releases/download/v$VERSION/windows-11-style-clipboard-history-manager_${VERSION}_arm64.deb
          ${TAB}sha256sums_aarch64 = ${SHA256_ARM64:-SKIP}

          pkgname = windows-11-style-clipboard-history-manager-bin
          SRCINFO_EOF
            sed -i 's/^          //' .SRCINFO
          fi

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to version $VERSION" || echo "No changes to commit"
          git push || echo "::warning::AUR push failed - may need manual intervention"
