name: E2E Tests

# End-to-End Testing with Playwright
# تست‌های E2E با Playwright
#
# This workflow runs comprehensive E2E tests using Playwright.
# These tests verify the application works correctly in a real environment.
#
# NOTE: This workflow requires the `workflows` permission to be enabled
# for the GitHub App. To apply this workflow, run:
#   git am docs/patches/hardened-ci-workflows.patch
# Or manually copy this file to .github/workflows/

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test'
        required: false
        default: 'webkit'
        type: choice
        options:
          - webkit
          - chromium
          - firefox
          - all

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests (${{ inputs.browser || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            xvfb \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libgbm1 \
            libxkbcommon0

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build
        timeout-minutes: 45

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright dependencies
        run: |
          sudo apt-get install -y \
            libxcb1 \
            libxcb-render0 \
            libxcb-shape0 \
            libxcb-xfixes0

      - name: Run E2E tests (webkit)
        if: inputs.browser == 'webkit' || inputs.browser == '' || github.event.inputs.browser == 'all'
        run: npx playwright test --project=webkit --reporter=list
        timeout-minutes: 30

      - name: Run E2E tests (chromium)
        if: inputs.browser == 'chromium' || github.event.inputs.browser == 'all'
        run: npx playwright test --project=chromium --reporter=list
        timeout-minutes: 30

      - name: Run E2E tests (firefox)
        if: inputs.browser == 'firefox' || github.event.inputs.browser == 'all'
        run: npx playwright test --project=firefox --reporter=list
        timeout-minutes: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results-${{ runner.os }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-screenshots-${{ runner.os }}
          path: test-results/**/screenshots/
          if-no-files-found: warn
          retention-days: 7
